<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallway walk — procedural animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#e3e1d9;font:15px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(94vw,560px);padding:30px 0}h1{font-size:20px;font-weight:500}p{color:#aaa;line-height:1.5}svg{display:block;width:100%;aspect-ratio:480/426;background:#777767}button,select{font:inherit;color:inherit;background:#292929;border:1px solid #555;border-radius:5px;padding:9px 14px}nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}label{margin-left:auto}small{display:block;margin-top:18px;color:#aaa}
</style>
<main>
<h1>Hallway walk</h1>
<svg viewBox="0 0 480 426" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">Your illustrated character walking down a hallway</title>
<desc id="scene-desc">A procedural interpretation of the supplied GIF, with a swaying body, bobbing shoulders and moving hallway perspective.</desc>
<defs>
<linearGradient id="wall"><stop stop-color="#818171"/><stop offset="1" stop-color="#4b4b41"/></linearGradient>
<linearGradient id="skin"><stop stop-color="#b2a18b"/><stop offset="1" stop-color="#796b5d"/></linearGradient>
<linearGradient id="coat"><stop stop-color="#25252b"/><stop offset="1" stop-color="#0c0c12"/></linearGradient>
<filter id="grain"><feTurbulence baseFrequency=".75" numOctaves="3" seed="14"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
<g filter="url(#grain)">
<path fill="url(#wall)" d="M0 0H480V426H0Z"/>
<path fill="#a09e86" d="M0 0 260 95 260 330 0 426Z"/>
<path fill="#696c5b" d="M480 0 260 95 260 330 480 426Z"/>
<path fill="#686858" d="m0 426 260-96 220 96Z"/>
<path fill="#666758" d="m0 0 260 95L480 0Z"/>
<path fill="#333a31" d="M230 92h60v245h-60z"/>
<g id="hall"></g>
<g id="bystanders">
<g transform="translate(21 247)"><ellipse cy="-43" rx="22" ry="29" fill="#8a806d"/><path d="M-40 15Q-28-22 0-18Q25-16 47 30L38 156H-40" fill="#3d4140"/><path d="M-23-52q1-33 32-20l13 15q-24-12-45 5" fill="#35352d"/></g>
<g transform="translate(414 236)"><ellipse cy="-53" rx="19" ry="27" fill="#a29278"/><path d="M-32 1Q-18-26 3-22Q34-24 45 14L43 154H-40" fill="#929287"/><path d="m-19-64q3-30 30-12l8 14" fill="#645342"/><path d="m-20 13 39 24M-12 40l40-35" stroke="#716858" stroke-width="17"/></g>
<g transform="translate(341 245) scale(.6)"><ellipse cy="-53" rx="20" ry="28" fill="#897c66"/><path d="M-30 3Q0-40 35 2L35 100H-30" fill="#c5bca0"/><path d="M-22-45Q-36-91 9-90Q35-84 24-38" fill="#262824"/></g>
</g>
<g id="walker">
<image href="character.png" x="0" y="0" width="480" height="460" preserveAspectRatio="xMidYMid meet"/>
</g>
</g>
</svg>
<nav aria-label="Animation controls"><button id="pause" aria-pressed="false">Pause</button><button id="replay">Replay</button><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></nav>
<small>Walking motion inspired by the <a href="https://giphy.com/gifs/emo-pVuja7BJl0Eow" style="color:inherit">reference GIF</a>. Uses your supplied character illustration with a generated transparent cutout. No video or external libraries.</small>
</main>
<script src="animation.js"></script>
</html>
